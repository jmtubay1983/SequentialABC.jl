name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Julia ${{ matrix.julia }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      JULIA_PROJECT: '@.'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        julia: ['1.10', '1']
        exclude:
          # Latest stable only needed on ubuntu; 1.10 covers all platforms
          - os: windows-latest
            julia: '1'
          - os: macos-latest
            julia: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.julia
            ~/.cache
          key: ${{ runner.os }}-julia-${{ hashFiles('**/Project.toml', '**/Manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-

      - name: Instantiate, build, and test
        run: julia -e 'using Pkg; Pkg.instantiate(); Pkg.build(); Pkg.test()'

  validation-gates:
    name: Validation gates
    runs-on: ubuntu-latest
    env:
      JULIA_PROJECT: '@.'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.julia
            ~/.cache
          key: ${{ runner.os }}-julia-${{ hashFiles('**/Project.toml', '**/Manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-

      - name: Instantiate and run validation gates
        run: |
          julia -e 'using Pkg; Pkg.instantiate()'
          julia --project=. test/gates/run_gates.jl | tee /tmp/gates_output.txt
      - name: Write verdict to job summary
        run: |
          echo "## Validation Gates Verdict" >> $GITHUB_STEP_SUMMARY
          grep -E 'VALIDATION VERDICT|Missing production capabilities|Not run' /tmp/gates_output.txt >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Gate-by-gate:" >> $GITHUB_STEP_SUMMARY
          grep -E 'Gate [1-4]' /tmp/gates_output.txt >> $GITHUB_STEP_SUMMARY || true
