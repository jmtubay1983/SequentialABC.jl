# Example-only environment for the plotting API (examples/plot_examples.jl).
#
# Run with:
#   julia --project=examples/plots_env examples/plot_examples.jl
#
# These are deliberately NOT dependencies of the SequentialABC package itself;
# the plotting API loads Plots/StatsPlots lazily via Requires.jl.
[deps]
Distributions = "31c24e10-a181-5473-b8eb-7969acd0382f"
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"
SequentialABC = "9ec30f26-5bd5-453c-9fb9-4a291198e4b8"
StatsPlots = "f3b207a7-027a-5e70-b257-86293d7955fd"

[sources]
SequentialABC = { path = "../.." }
